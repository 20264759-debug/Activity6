<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Mejia's Creatives</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background-color: #f4f1eb;
    color: #2b2b2b;
  }

  header {
    background-color: #3a3a3a;
    color: #ffffff;
    padding: 16px 40px 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 14px;
  }

  .header-divider {
    border: none;
    border-top: 1px solid #6b6b6b;
    margin: 0;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #e8d9b5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: #3a3a3a;
  }

  .logo-area h1 {
    font-size: 18px;
    letter-spacing: 2px;
    font-weight: 600;
  }

  nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 36px;
    padding: 14px 0;
    flex-wrap: wrap;
  }

  nav a {
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    padding-bottom: 4px;
  }

  nav a:hover { color: #e8d9b5; }

  nav a.active {
    color: #e8d9b5;
    border-bottom: 1px solid #e8d9b5;
  }

  main {
    max-width: 900px;
    margin: 60px auto;
    padding: 80px 40px;
    background-color: #f7f4ee;
    text-align: center;
    border-radius: 4px;
  }

  main h2 {
    font-size: 40px;
    letter-spacing: 3px;
  }

  footer {
    background-color: #3a3a3a;
    color: #cfcfcf;
    text-align: center;
    padding: 18px;
    font-size: 13px;
    letter-spacing: 1px;
  }

  @media (max-width: 700px) {
    header { padding: 16px 16px 0; }
    nav ul { gap: 20px; }
    main { margin: 20px 12px; padding: 48px 20px; }
    main h2 { font-size: 28px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-area">
      <div class="logo-circle">MA</div>
      <h1>MEJIA'S CREATIVES</h1>
    </div>
  </div>
  <hr class="header-divider">
  <nav aria-label="Main">
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="gallery.html" class="active">GALLERY</a></li>
      <li><a href="contact.html">CONTACT</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2>GALLERY</h2>
</main>

<footer>
  &copy; 2026 Mejia's Creatives
</footer>

</body>
</html>
