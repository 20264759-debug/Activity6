<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Mejia's Creatives</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background-color: #f4f1eb;
    color: #2b2b2b;
  }

  header {
    background-color: #3a3a3a;
    color: #ffffff;
    padding: 16px 40px 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 14px;
  }

  .header-divider {
    border: none;
    border-top: 1px solid #6b6b6b;
    margin: 0;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #e8d9b5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: #3a3a3a;
  }

  .logo-area h1 {
    font-size: 20px;
    letter-spacing: 3px;
    font-weight: 700;
  }

  nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 0;
    flex-wrap: wrap;
  }

  nav a {
    display: block;
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 16px 32px;
    border-bottom: 3px solid transparent;
  }

  nav a:hover { color: #e8d9b5; }

  /* Active page: highlighted tab with underline */
  nav a.active {
    color: #e8d9b5;
    background-color: #2a2a2a;
    border-bottom: 3px solid #e8d9b5;
  }

  /* ---------- Portfolio card + grid ---------- */
  .portfolio-card {
    max-width: 1000px;
    margin: 50px auto;
    padding: 40px 40px 50px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    text-align: center;
  }

  .portfolio-card h2 {
    font-size: 24px;
    font-weight: 700;
  }

  .portfolio-card .subtitle {
    margin: 10px 0 36px;
    font-size: 14px;
    color: #6b6b6b;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 28px 24px;
    justify-items: center;
  }

  .gallery-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .gallery-item img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #3a3a3a;
  }

  .gallery-item figcaption {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  footer {
    background-color: #000000;
    color: #cfcfcf;
    text-align: center;
    padding: 18px;
    font-size: 13px;
    letter-spacing: 1px;
  }

  @media (max-width: 700px) {
    header { padding: 16px 16px 0; }
    nav a { padding: 14px 14px; }
    .portfolio-card { margin: 20px 12px; padding: 28px 16px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 701px) and (max-width: 900px) {
    .gallery-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
